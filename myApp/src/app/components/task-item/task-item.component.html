<ion-item lines="none">
  <ion-label>
    <h2>{{ task.title }}</h2>
    <p class="task-desc">{{ task.description }}</p>
  </ion-label>

  <span slot="end"
        class="status-chip"
        [ngClass]="{
          'status-todo': task.status === 'To Do',
          'status-progress': task.status === 'In Progress',
          'status-completed': task.status === 'Completed'
        }">
    {{ task.status }}
  </span>
</ion-item>
