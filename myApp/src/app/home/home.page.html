<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>ToDo App</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-list>
    <ion-list-header>
      <ion-label>Task List</ion-label>
    </ion-list-header>

    <!-- Iterate and pass the individual task object to the child component -->
    <app-task-item
      *ngFor="let currentTask of mockTasks"
      [task]="currentTask">
    </app-task-item>

  </ion-list>
</ion-content>
